[client]
# Oculta el menú de desarrollador de Streamlit a los visitantes
toolbarMode = "minimal"
# Los visitantes no ven trazas de error internas
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#0B0D17"
secondaryBackgroundColor = "#151829"
textColor = "#E7E8F2"
borderColor = "#262A40"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "large"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#10131F"
